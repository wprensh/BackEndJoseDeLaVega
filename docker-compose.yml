# PostgreSQL local para desarrollo: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: jose-de-la-vega-db
    environment:
      POSTGRES_DB: jose_de_la_vega
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jose_de_la_vega"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
